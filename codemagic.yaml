workflows:

  ios-adhoc:
    name: iOS AdHoc

    environment:
      flutter: 3.50.1

      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.equivalencias.crisfiit

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Configure code signing
        script: xcode-project use-profiles

      - name: Build IPA
        script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist

      - name: Save iOS diagnostic artifacts
        script: |
          mkdir -p build/ios/diagnostics

          ARCHIVE="build/ios/archive/Runner.xcarchive"
          DIAG="build/ios/diagnostics"

          echo "=== DIAGNOSTIC INFORMATION ===" > "$DIAG/UUID-report.txt"
          date >> "$DIAG/UUID-report.txt"

          echo "" >> "$DIAG/UUID-report.txt"
          echo "=== ARCHIVE CONTENTS ===" >> "$DIAG/UUID-report.txt"

          if [ -d "$ARCHIVE" ]; then

            echo "Archive found: $ARCHIVE" >> "$DIAG/UUID-report.txt"

            echo "" >> "$DIAG/UUID-report.txt"
            echo "=== RUNNER EXECUTABLE ===" >> "$DIAG/UUID-report.txt"

            EXECUTABLE="$ARCHIVE/Products/Applications/Runner.app/Runner"

            if [ -f "$EXECUTABLE" ]; then
              xcrun dwarfdump --uuid "$EXECUTABLE" \
                >> "$DIAG/UUID-report.txt" 2>&1 || true
            else
              echo "Runner executable not found." >> "$DIAG/UUID-report.txt"
            fi

            echo "" >> "$DIAG/UUID-report.txt"
            echo "=== ALL DEBUG SYMBOLS ===" >> "$DIAG/UUID-report.txt"

            find "$ARCHIVE/dSYMs" -name "*.dSYM" -print 2>/dev/null |
            while IFS= read -r dsym; do
              echo "" >> "$DIAG/UUID-report.txt"
              echo "$dsym" >> "$DIAG/UUID-report.txt"

              xcrun dwarfdump --uuid "$dsym" \
                >> "$DIAG/UUID-report.txt" 2>&1 || true
            done

            echo "" >> "$DIAG/UUID-report.txt"
            echo "=== ARCHIVE COMPRESSION ===" >> "$DIAG/UUID-report.txt"

            ditto -c -k --sequesterRsrc --keepParent \
              "$ARCHIVE" "$DIAG/Runner.xcarchive.zip" \
              2>> "$DIAG/UUID-report.txt" || true

          else
            echo "ERROR: Runner.xcarchive not found." >> "$DIAG/UUID-report.txt"
          fi

          echo "" >> "$DIAG/UUID-report.txt"
          echo "=== AVAILABLE BUILD FILES ===" >> "$DIAG/UUID-report.txt"

          find build/ios -maxdepth 4 -type f \
            >> "$DIAG/UUID-report.txt" 2>/dev/null || true

          echo "" >> "$DIAG/UUID-report.txt"
          echo "=== XCODE LOG FILES ===" >> "$DIAG/UUID-report.txt"

          ls -lah /tmp/xcodebuild_logs/ \
            >> "$DIAG/UUID-report.txt" 2>&1 || true

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/diagnostics/*.zip
      - build/ios/diagnostics/*.txt
      - /tmp/xcodebuild_logs/*.log


  ios-appstore:
